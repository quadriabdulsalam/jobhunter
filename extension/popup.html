<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JobHunter AI</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #ffffff;
      font-size: 13px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #10b981;
    }
    .badge.offline {
      color: #ef4444;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      text-align: center;
      text-decoration: none;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #ffffff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">JH</div>
    <div class="title">JobHunter AI Copilot</div>
  </div>

  <div class="card">
    <div class="status-row">
      <span style="color: #94a3b8;">Local Studio:</span>
      <span id="studio-status" class="badge">
        <span class="dot"></span> Checking...
      </span>
    </div>
    <div class="status-row" style="margin-bottom: 0;">
      <span style="color: #94a3b8;">Active Profile:</span>
      <span id="profile-name" style="color: #e2e8f0; font-weight: 500;">Loading...</span>
    </div>
  </div>

  <a href="http://localhost:3000" target="_blank" class="btn">
    Launch JobHunter Studio ↗
  </a>

  <script src="popup.js"></script>
</body>
</html>
