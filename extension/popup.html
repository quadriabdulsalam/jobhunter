<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobhunter</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; }
    body {
      width: 360px; min-height: 300px; margin: 0; padding: 20px;
      color: #211d19; background: #f7f6f3;
      font: 13px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header { display: flex; align-items: center; gap: 11px; margin-bottom: 18px; }
    .mark {
      display: grid; place-items: center; width: 36px; height: 36px; flex: 0 0 auto;
      border-radius: 11px; color: #fff; background: #c04e1b; font-size: 13px; font-weight: 750;
      letter-spacing: -.04em;
    }
    h1 { margin: 0; color: #211d19; font-size: 16px; font-weight: 700; letter-spacing: -.035em; }
    .subtle { margin: 2px 0 0; color: #776e66; font-size: 11px; }
    .status {
      display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 10px 12px;
      margin-bottom: 17px; border: 1px solid #e6e0d8; border-radius: 11px;
      color: #655d56; background: #fff; font-size: 12px;
    }
    .dot { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: #aaa39b; }
    .status.online { border-color: #d9e7d9; background: #f5faf4; color: #426447; }
    .status.online .dot { background: #39825a; }
    .status.offline { border-color: #ecd8d2; background: #fff8f6; color: #8e3e2d; }
    .status.offline .dot { background: #b5473a; }
    label { display: grid; gap: 6px; margin: 12px 0; color: #514941; font-size: 11px; font-weight: 650; }
    input, select {
      width: 100%; height: 42px; padding: 0 11px; border: 1px solid #e1dbd3;
      border-radius: 9px; background: #fff; color: #211d19; font: inherit;
    }
    input:focus, select:focus { outline: 2px solid #963b16; outline-offset: 2px; border-color: #c04e1b; }
    button, .link {
      display: grid; place-items: center; width: 100%; min-height: 43px; padding: 9px 13px;
      border: 1px solid #c04e1b; border-radius: 9px; background: #c04e1b; color: #fff;
      font: inherit; font-size: 12px; font-weight: 650; text-decoration: none; cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
    }
    button:hover:not(:disabled), .link:hover { background: #a94317; border-color: #a94317; }
    button:disabled { opacity: .58; cursor: wait; }
    .secondary { border-color: #e1dbd3; background: #fff; color: #3c352f; }
    .secondary:hover:not(:disabled), .link.secondary:hover { border-color: #d4c8bd; background: #f8f4ef; color: #211d19; }
    .actions { display: grid; gap: 8px; margin-top: 12px; }
    #login-form { padding: 15px; border: 1px solid #e9e3dc; border-radius: 13px; background: #fff; }
    #login-form label:first-child { margin-top: 0; }
    #login-form > button { margin-top: 5px; }
    #message { min-height: 16px; margin: 10px 0 0; color: #a23328; font-size: 11px; }
    #message:empty { display: none; }
    #account {
      display: none; padding: 15px; border: 1px solid #e0e8dc; border-radius: 13px;
      background: #fff;
    }
    #account-name { overflow: hidden; color: #342d27; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .footer { margin: 14px 0 0; color: #8a8179; font-size: 10px; text-align: center; }
    a:focus-visible, button:focus-visible { outline: 2px solid #963b16; outline-offset: 3px; }
  </style>
</head>
<body>
  <header>
    <div class="mark">J</div>
    <div><h1>Jobhunter</h1><p class="subtle">LinkedIn job copilot</p></div>
  </header>

  <div id="status" class="status"><span class="dot"></span><span id="status-text">Checking connection…</span></div>

  <label for="app-url">Connect to
    <select id="app-url">
      <option value="https://jobhunter-azure.vercel.app">Jobhunter online</option>
      <option value="http://localhost:3000">Local development</option>
    </select>
  </label>

  <form id="login-form">
    <label for="email">Email<input id="email" name="email" type="email" autocomplete="username" required></label>
    <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
    <button id="sign-in" type="submit">Sign in</button>
    <div class="actions">
      <a id="browser-connect" class="link secondary" target="_blank" rel="noreferrer">Continue with Google or GitHub</a>
      <a id="create-account" class="link secondary" target="_blank" rel="noreferrer">Create an account</a>
    </div>
  </form>

  <section id="account">
    <div id="account-name"></div>
    <div class="actions">
      <a id="open-studio" class="link" target="_blank" rel="noreferrer">Open Jobhunter</a>
      <button id="sign-out" class="secondary" type="button">Sign out</button>
    </div>
  </section>

  <p id="message" role="alert"></p>
  <p class="footer">Your sign-in stays in this browser.</p>
  <script src="popup.js"></script>
</body>
</html>
